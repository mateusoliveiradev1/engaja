name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  local-equivalent-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run local-equivalent quality gates
        run: pnpm ci:local
